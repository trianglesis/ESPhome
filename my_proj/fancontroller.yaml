# Board: ESP32-C6 DevKitC-1 (Espressif)
# Definition: definitions/boards/esp32-c6-devkitc-1/manifest.yaml

substitutions:
  name: "easun"
  friendly_name: SMGII
  device_description: "Monitor and control a ISolar/EASUN SMG II inverter via RS232"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: "syssi.esphome-smg-ii"
    version: 1.3.0

esp32:
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y

logger:
  level: INFO
  logs:
    component: ERROR
    modbus_controller: ERROR

api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 300s
  fast_connect: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: FanController Fallback Hotspot
    password: "qNcMPVBsrlCT"

captive_portal:

time:
  - platform: sntp

web_server:
  compression: gzip
  port: 80
  version: 3
  sorting_groups:
  - id: sorting_group_general_info
    name: "General info"
    sorting_weight: -1
  - id: sorting_group_battery_sensors
    name: "Battery Sensors"
    sorting_weight: 10
  - id: sorting_group_battery_options
    name: "Battery Options"
    sorting_weight: 20
  - id: sorting_group_invertor_sensors
    name: "Invertor Sensors"
    sorting_weight: 30
  - id: sorting_group_invertor_options
    name: "Invertor Options"
    sorting_weight: 40
  - id: sorting_group_options
    name: "Options"
    sorting_weight: 50
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60

# Inverter
uart:
  - id: uart_0
    baud_rate: 9600
    tx_pin: GPIO02
    rx_pin: GPIO03

modbus:
  - id: modbus0
    uart_id: uart_0
    send_wait_time: 200ms

modbus_controller:
  - id: smg0
    address: 0x01
    modbus_id: modbus0
    command_throttle: 200ms
    update_interval: 60s
  # Faster update for most critical values!
  # Exclude from HA recorder!
  - id: smgfast
    address: 0x01
    modbus_id: modbus0
    command_throttle: 200ms
    update_interval: 250ms

#### SENSORS
sensor:
  # COMMON
  # Network info
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 300s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 120s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  # INVERTER


### PWM CONTROLLER
output:
  - platform: ledc
    pin: GPIO12
    frequency: 25000Hz
    id: fan1_pwm
  - platform: ledc
    pin: GPIO04
    frequency: 25000 Hz
    id: fan2_pwm
  - platform: ledc
    pin: GPIO05
    frequency: 25000 Hz
    id: fan3_pwm
  - platform: ledc
    pin: GPIO06
    frequency: 25000 Hz
    id: fan4_pwm
  - platform: ledc
    pin: GPIO07
    frequency: 25000 Hz
    id: fan5_pwm

### FAN CONTROLLER
fan:
  - platform: speed
    output: fan1_pwm
    name: "Fan 1"
    speed_count: 5
  - platform: speed
    output: fan2_pwm
    name: "Fan 2"
    speed_count: 5
  - platform: speed
    output: fan3_pwm
    name: "Fan 3"
    speed_count: 5
  - platform: speed
    output: fan4_pwm
    name: "Fan 4"
    speed_count: 5
  - platform: speed
    output: fan5_pwm
    name: "Fan 5"
    speed_count: 5


# Buitin LED
light:
  - platform: esp32_rmt_led_strip
    name: Status LED
    id: co2light
    pin: GPIO8
    channel_colors: GRB
    num_leds: 1
    chipset: ws2812
    web_server: 
      sorting_group_id: sorting_group_service

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    bssid:
      name: "${friendly_name} Connected BSSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    mac_address:
      name: "${friendly_name} Mac Wifi Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    dns_address:
      name: "${friendly_name} DNS Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic