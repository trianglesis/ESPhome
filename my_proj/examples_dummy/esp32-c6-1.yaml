substitutions:
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"

esphome:
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"

# https://esphome.io/components/esp32
esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y
    version: "5.3.1"
    platform_version: 6.9.0

logger:
  level: DEBUG
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 900s
  fast_connect: true

captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 10
  - id: sorting_group_monitor
    name: "Sensor monitor"
    sorting_weight: 10
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60
  - id: sorting_group_service
    name: "Service"
    sorting_weight: 90

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
      address_0:
        name: "${friendly_name} IP Address 0"
        web_server:
          sorting_group_id: sorting_group_diagnostic
      address_1:
        name: "${friendly_name} IP Address 1"
        web_server:
          sorting_group_id: sorting_group_diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    bssid:
      name: "${friendly_name} Connected BSSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    mac_address:
      name: "${friendly_name} Mac Wifi Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    scan_results:
      name: "${friendly_name} Latest Scan Results"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    dns_address:
      name: "${friendly_name} DNS Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    web_server:
          sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${friendly_name} WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${friendly_name}  WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic
  
  # Custom
  - platform: gpio
    name: "Pin GPIO23"
    pin: GPIO23
    web_server:
      sorting_group_id: sorting_group_monitor

button:
- platform: restart
  name: "Restart"
  web_server:
    sorting_group_id: sorting_group_service