# https://www.youtube.com/watch?v=FJGy4X0ubIQ
# https://esphome.io/components/media_player/speaker/

substitutions:
  name: chipfixpa
  friendly_name: ChipFix-PA
  task_stack_in_psram: "true"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.7.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: ESP32S3
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # Her velger vi partisjonstabell direkte i config (ingen CSV-fil trengs)
      CONFIG_PARTITION_TABLE_SINGLE_APP: "y" 
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

logger:
  level: DEBUG
  baud_rate: 115200

# Husk: Quad mode for 2MB PSRAM
psram:
  mode: quad
  speed: 80MHz
  ignore_not_found: false

api:
  encryption:
    key: "wTd6leVJzcgJJTafi9+mnwUbEebRFPuIlC51s0p7VqU="

ota:
  - platform: esphome
    password: "8d45d94592a23388eb022aa76e2cb71f"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE 

i2s_audio:
  i2s_lrclk_pin: 2
  i2s_bclk_pin: 1

light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    rgb_order: GRB
    pin: 48
    num_leds: 1
    name: "Status LED"
    id: status_led

external_components:
  # PR 12253 - Mixer
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12253/head
    components: [mixer]
    refresh: 1d
  # PR 12254 - Resampler
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12254/head
    components: [resampler]
    refresh: 1d
  # PR 12256 - Audio
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12256/head
    components: [audio]
    refresh: 1d
  # PR 12258 - Media Player
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12258/head
    components: [media_player]
    refresh: 1d
  # PR 12284 - SendSpin & MDNS
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12284/head
    components: [mdns, sendspin]
    refresh: 1d
  # PR 12429 - File, HTTP, Speaker
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12429/head
    components: [file, http_request, media_source, speaker_source]
    refresh: 1d

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true
  kalman_process_error: 0.01

media_source:
  - platform: sendspin
    id: sendspin_source

text_sensor:
  - platform: sendspin
    type: title
    name: Track Title
    id: track_title 
  - platform: sendspin
    type: artist
    name: Artist
    id: artist_name
  - platform: sendspin
    type: album
    name: Album
    id: album_name 

speaker:
  - platform: i2s_audio
    id: Sendspin_Spkr
    sample_rate: 48000
    i2s_dout_pin: 3
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 120ms

media_player:
  - platform: sendspin
    id: sendspin_group_media_player

  - platform: speaker_source
    id: sendspin_player
    media_speaker: Sendspin_Spkr
    sources:
      - sendspin_source
    volume_increment: 5%
    volume_initial: 50%
    name: "${friendly_name} Player"

interval:
  - interval: 1s
    then:
      - if:
          condition:
            # Sjekker om den fysiske spilleren faktisk spiller
            media_player.is_playing: sendspin_player
          then:
            - light.turn_on:
                id: status_led
                brightness: 50%
                red: 0%
                green: 100%
                blue: 0%
          else:
            - light.turn_on:
                id: status_led
                brightness: 30%
                red: 0%
                green: 0%
                blue: 100%

i2c:
  sda: 8
  scl: 9
  scan: true
  frequency: 100kHz 

font:
  - file: "gfonts://Roboto"
    id: font_header
    size: 14  # Litt stor for 128x64, kanskje 12 er bedre
  
  - file: "gfonts://Roboto"
    id: font_detail
    size: 10  # Liten nok til å få plass til tekst

# SKJERM (SSD1306 eller SH1106 - sjekk modulen din)
display:
  - platform: ssd1306_i2c  # <-- Prøv denne først!
    model: "SH1106 128x64"
    address: 0x3C # Standard, noen ganger 0x3D
    id: my_oled
    update_interval: 1s
    lambda: |-
      // Play/Pause Ikon eller Status
      if (id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING) {
         it.print(0, 0, id(font_header), "PLAY >");
      } else {
         it.print(0, 0, id(font_header), "PAUSE ||");
      }
      
      // Artist og Tittel (Disse kan scrolles med litt c++ magi hvis ønskelig)
      it.print(0, 20, id(font_detail), id(artist_name).state.c_str());
      it.printf(0, 40, id(font_detail), "%s", id(track_title).state.c_str());

# KNAPPER (Direkte koblet til SendSpin-handlinger)
binary_sensor:
  - platform: gpio
    pin: 
      number: 4
      mode: INPUT_PULLUP
      inverted: true # Antar knapp kobler mot GND
    name: "Volum Opp"
    on_press:
      - media_player.volume_up: sendspin_player

  - platform: gpio
    pin: 
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    name: "Volum Ned"
    on_press:
      - media_player.volume_down: sendspin_player

  - platform: gpio
    pin: 
      number: 6
      mode: INPUT_PULLUP
      inverted: true
    name: "Play Pause"
    on_press:
      - media_player.toggle: sendspin_player

  - platform: gpio
    pin: 
      number: 7
      mode: INPUT_PULLUP
      inverted: true
    name: "Neste"
    on_press:
      - media_player.next: sendspin_player

button:
  - platform: restart
    name: "Restart"