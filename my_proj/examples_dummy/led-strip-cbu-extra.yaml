# Basic Config
substitutions:
  name: "SCW-WB-CB003"
  friendly_name: "Led Strip CBU"

esphome:
  name: led-strip
  friendly_name: led-strip

# https://docs.libretiny.eu/boards/cbu/
# https://developer.tuya.com/en/docs/iot/cbu-module-datasheet?id=Ka07pykl5dk4u
# https://github.com/libretiny-eu/libretiny/pull/215#issuecomment-1850540827
bk72xx:
  board: cbu
  family: BK7231N
  framework:
    loglevel: DEBUG
    debug:
    # version: dev

# Tuya MCU on UART1 (BK72xx example)
uart:
  rx_pin: P10  # P1, P10
  tx_pin: P11  # P0, P11
  baud_rate: 115200
    
logger:
  level: DEBUG
api:
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
    password: !secret ota_password
# Setup your WiFi password
wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 100s
  fast_connect: true

# captive_portal:

# web_server:
#   port: 80

# Pin specs from: https://docs.libretiny.eu/boards/cbu/
# P6 = Blue
# P24 = Green
# P26 = Red
output:
  # Colours
  # P6      PWM0 - BLUE, but died!
- platform: libretiny_pwm
  pin: P6
  id: output_pwm0
  frequency: 4000 Hz
  # P7      PWM1 - NOTHING - not died
- platform: libretiny_pwm
  pin: P7
  id: output_pwm1
  # P8      PWM2 - NOTHING - not died
- platform: libretiny_pwm
  pin: P8
  id: output_pwm2
  # P9      PWM3 - NOTHING - not died
- platform: libretiny_pwm
  pin: P9
  id: output_pwm3
  # P24     PWM4  - GREEN, but died!
- platform: libretiny_pwm
  pin: P24
  id: output_pwm4
  frequency: 4000 Hz
  # P26     PWM5  - RED, but died!
- platform: libretiny_pwm
  pin: P26
  id: output_pwm5
  frequency: 4000 Hz
  
light:
  - platform: rgb
    name: "rgb_strip_01"
    id: rgb_lightstrip1
    red: output_pwm5
    green: output_pwm4
    blue: output_pwm0
    default_transition_length: 3s
    flash_transition_length: 1s
    restore_mode: ALWAYS_OFF
    initial_state:
      state: false

switch:
  - platform: gpio
    id: relay
    name: strip_relay
    pin: P22
#   # P6      PWM0 - dying when ON
#   # - platform: gpio
#   #   name: switch P6 
#   #   pin: P6
#   # P7      PWM1
#   # - platform: gpio
#   #   name: switch P7 
#   #   pin: P7
#   # # P8      PWM2
#   # - platform: gpio
#   #   name: switch P8 
#   #   pin: P8
#   # # P9      PWM3
#   # - platform: gpio
#   #   name: switch P9 
#   #   pin: P9
#   # P24     PWM4 - dying when ON
#   # - platform: gpio
#   #   name: switch P24
#   #   pin: P24
#   # P26     PWM5 - dying when ON
#   # - platform: gpio
#   #   name: switch P26
#   #   pin: P26

text_sensor:
- platform: libretiny
  version:
    name: LibreTiny Version

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
  - platform: adc
    pin: P23
    name: "ADC Raw value"
    unit_of_measurement: "V"
    update_interval: 1s
  # - platform: pulse_meter
  #   pin: P7
  #   name: "PWM1"
  # - platform: pulse_meter
  #   pin: P8
  #   name: "PWM2"
  # - platform: pulse_meter
  #   pin: P9
  #   name: "PWM3"


##
# Service buttons
##

button:
- platform: restart
  name: "Restart"