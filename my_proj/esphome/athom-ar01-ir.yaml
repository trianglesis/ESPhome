# https://esphome.io/components/remote_receiver.html#configuration-variables
substitutions:
  name: "home-infrared"
  friendly_name: "Athom IR"

esphome:
  name: athom-ar01-ir
  friendly_name: Athom AR01 IR

esp8266:
  board: esp8285
  restore_from_flash: true

logger:
  level: DEBUG
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 900s
  fast_connect: true

captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 10
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60
  - id: sorting_group_service
    name: "Service"
    sorting_weight: 90
  
api:
  encryption:
    key: !secret api_key
  # Services
  # PRONTO https://community.home-assistant.io/t/esp32-ir-remote-pronto-inconsistent-data-not-sending/504681/13
  # https://esphome.io/cookbook/lambda_magic.html#delaying-remote-transmissions
  # https://esphome.io/components/remote_transmitter.html#remote-transmitter-transmit-action
  # Removed for now

remote_receiver:
  id: ar01ir_kitchen
  pin:
    number: GPIO5
    inverted: true
  # Dump: https://community.home-assistant.io/t/esphome-ir-blaster-example/453159/23
  # dump: 
  #   - raw
  #   - lg
  # dump: all # Dumps received codes to logs.
  dump: raw
  idle: 100ms
  # high 55% tolerance is recommended for some remote control units
  tolerance: 55%

remote_transmitter:
  pin:
    number: GPIO4
  carrier_duty_percent: 50%

output:
  - platform: gpio
    pin: GPIO12
    id: gpio_12
  - platform: gpio
    pin: GPIO13
    id: gpio_13

switch:
  - name: "Top LED"
    id: led_top
    platform: output
    output: gpio_12
    web_server:
      sorting_group_id: sorting_group_controls
  - name: "Middle LED"
    id: led_middle
    platform: output
    output: gpio_13
    web_server:
      sorting_group_id: sorting_group_controls

sensor:
  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

binary_sensor:
  - platform: status
    name: "${friendly_name} IR Status"
    web_server:
      sorting_group_id: sorting_group_diagnostic
  - platform: gpio
    pin:
      number: GPIO0
      mode:
        input: true
      inverted: true
    name: Bottom Button
    on_press:
      then:
        - switch.toggle:
            id: led_middle
        - delay: 2s
        - switch.toggle:
            id: led_top
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      web_server:
        sorting_group_id: sorting_group_diagnostic
    ssid:
      name: "${friendly_name} SSID"
      web_server:
        sorting_group_id: sorting_group_diagnostic
    bssid:
      name: "${friendly_name} BSSID"
      web_server:
        sorting_group_id: sorting_group_diagnostic
    mac_address:
      name: "${friendly_name} Mac Wifi Address"
      web_server:
        sorting_group_id: sorting_group_diagnostic

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: sorting_group_service

