substitutions:
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"

esphome:
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"
  # https://github.com/esphome/esphome/pull/1651
  platformio_options:
    build_flags: "-DI2C_NUM_1=I2C_NUM_0"

# https://esphome.io/components/esp32
esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y
    version: "5.3.1"
    platform_version: 6.9.0

# https://github.com/esphome/issues/issues/6639#issuecomment-2669790604
external_components:
  - source: github://pr#8283
    components: [ i2c ]

logger:
  level: DEBUG
  logs:
    sensor: INFO
    component: DEBUG
    scd4x.sensor: DEBUG
    esp-idf: INFO
    template.sensor: WARN
    text_sensor: WARN
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 900s
  fast_connect: true

captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
  - id: sorting_group_co2
    name: "CO2 Values (SDC41)"
    sorting_weight: -1
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 10
  - id: sorting_group_monitor
    name: "Sensor monitor"
    sorting_weight: 20
  - id: sorting_group_calibration
    name: "Calibration Values"
    sorting_weight: 40
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60
  - id: sorting_group_service
    name: "Service"
    sorting_weight: 90

# https://github.com/esphome/issues/issues/6639
i2c:
  sda: GPIO06
  scl: GPIO07
  scan: false
  id: bus_a

sensor:
  # https://esphome.io/components/sensor/scd4x.html#configuration-variables
  # https://esphome.io/components/sensor/index.html#sensor-filters
  - platform: scd4x
    i2c_id: bus_a
    address: 0x62
    id: scd41_esp32
    co2:
      name: "CO2"
      id: "ppm_co2"
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    temperature:
      name: "Temperature"
      id: "temperature"
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    humidity:
      name: "Humidity"
      id: "humidity"
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    update_interval: 5s
  # Store values for some time
  # 15 min
  - platform: template
    name: "CO2 ppm 15min average"
    id: co2_ppm_15m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 1
          send_first_at: 1
  # 1 hour
  - platform: template
    name: "CO2 ppm 1h average"
    id: co2_ppm_1h
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 60
          send_every: 1
          send_first_at: 1
  # 24 hours
  - platform: template
    name: "CO2 ppm 24h average"
    id: co2_ppm_24h
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 1440
          send_every: 1
          send_first_at: 1

  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    web_server:
          sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${friendly_name} WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${friendly_name}  WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
      address_0:
        name: "${friendly_name} IP Address 0"
        web_server:
          sorting_group_id: sorting_group_diagnostic
      address_1:
        name: "${friendly_name} IP Address 1"
        web_server:
          sorting_group_id: sorting_group_diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    bssid:
      name: "${friendly_name} Connected BSSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    mac_address:
      name: "${friendly_name} Mac Wifi Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    scan_results:
      name: "${friendly_name} Latest Scan Results"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    dns_address:
      name: "${friendly_name} DNS Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: sorting_group_service
  # Calibration actions:
  - platform: template
    name: "Calibrate by Atmo CO2 level"
    on_press:
      then:
      - scd4x.perform_forced_calibration:
          value: 427  # https://www.co2.earth/daily-co2
          id: scd41_esp32
    web_server:
      sorting_group_id: sorting_group_calibration


# https://gist.github.com/baldowl/a413c2a08c10bc62c1a72328caac98c1?permalink_comment_id=5496287#gistcomment-5496287
light:
  - platform: esp32_rmt_led_strip
    name: Status LED
    pin: GPIO8
    rgb_order: GRB
    num_leds: 1
    chipset: ws2812
    web_server: 
      sorting_group_id: sorting_group_controls
# END
