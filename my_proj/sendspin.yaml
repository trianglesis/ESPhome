substitutions:
  name: "storage_sendspin"
  friendly_name: "Storage Sendspin"

esphome:
  name: "storage_sendspin"
  friendly_name: "Storage Sendspin"
  # platformio_options:
  #   board_build.flash_mode: dio

esp32:
  # board: esp32
  variant: esp32s3
  cpu_frequency: 240MHz
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

psram:
  mode: quad
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  baud_rate: 115200
  logs:
    sensor: INFO
    component: WARN
    esp-idf: ERROR
    template.sensor: INFO
    text_sensor: INFO

api:
  encryption:
    key: !secret api_key

# Setup your WiFi password
wifi:
  networks:
  - ssid: !secret wifi_ssid
    password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 300s
  fast_connect: true

# Do not use WebServer, keep resources footprint low
time:
  - platform: homeassistant
    id: esptime

i2s_audio:
  i2s_lrclk_pin: GPIO2
  i2s_bclk_pin: GPIO1

external_components:
  # PR 12253 - Mixer
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12253/head
    components: [mixer]
    refresh: 1d
  # PR 12254 - Resampler
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12254/head
    components: [resampler]
    refresh: 1d
  # PR 12256 - Audio
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12256/head
    components: [audio]
    refresh: 1d
  # PR 12258 - Media Player
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12258/head
    components: [media_player]
    refresh: 1d
  # PR 12284 - SendSpin & MDNS
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12284/head
    components: [mdns, sendspin]
    refresh: 1d
  # PR 12429 - File, HTTP, Speaker
  - source:
      type: git
      url: https://github.com/esphome/esphome
      ref: pull/12429/head
    components: [file, http_request, media_source, speaker_source]
    refresh: 1d

# external_components:
#   - source:
#       # https://github.com/esphome/esphome/pull/14933
#       type: git
#       url: https://github.com/kahrendt/esphome
#       ref: 890e33f99af2c2ea15dc74c3ec4cf32d25203526
#     components: [const, media_source, sendspin]


sendspin:
  id: sendspin_hub
  task_stack_in_psram: true
  kalman_process_error: 0.01

media_source:
  - platform: sendspin
    id: sendspin_source
    # sample_rate: 48000
    # codecs: [flac, opus, pcm]
    buffer_size: 1000000

text_sensor:
  # https://esphome.io/components/text_sensor/sendspin/
  - platform: sendspin
    name: "Title"
    type: title
  - platform: sendspin
    name: "Artist"
    type: artist
  - platform: sendspin
    name: "Album"
    type: album
  - platform: sendspin
    name: "Album Artist"
    type: album_artist

  # Other
  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      icon: mdi:wifi
    ssid:
      name: "ESP Connected SSID"
      icon: mdi:wifi
    bssid:
      name: "ESP Connected BSSID"
      icon: mdi:wifi
    mac_address:
      name: "ESP Mac Wifi Address"
      icon: mdi:wifi
    dns_address:
      name: "ESP DNS Address"
      icon: mdi:wifi

speaker:
  - platform: i2s_audio
    id: Sendspin_Spkr
    sample_rate: 48000
    i2s_dout_pin: GPIO3
    bits_per_sample: 16bit
    dac_type: external
    channel: stereo
    timeout: never
    buffer_duration: 120ms

media_player:
  - platform: sendspin
    id: sendspin_group_media_player

  - platform: speaker_source
    id: sendspin_player
    media_speaker: Sendspin_Spkr
    sources:
      - sendspin_source
    volume_increment: 5%
    volume_initial: 50%
    name: "${friendly_name} Player"

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    name: "Volum Opp"
    on_press:
      - media_player.volume_up: sendspin_player

  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    name: "Volum Ned"
    on_press:
      - media_player.volume_down: sendspin_player

  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    name: "Play Pause"
    on_press:
      - media_player.toggle: sendspin_player

  - platform: gpio
    pin:
      number: GPIO7
      mode: INPUT_PULLUP
      inverted: true
    name: "Neste"
    on_press:
      - media_player.next: sendspin_player

button:
  - platform: restart
    name: "Restart"

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    
  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    icon: mdi:wifi
    
  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""

  # https://esphome.io/components/sensor/sendspin/
  # - platform: sendspin
  #   name: "Track Progress"
  #   type: track_progress
  # - platform: sendspin
  #   name: "Track Duration"
