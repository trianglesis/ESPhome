  # Other
  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic          
    ssid:
      name: "ESP Connected SSID"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      
