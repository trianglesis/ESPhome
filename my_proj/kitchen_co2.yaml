    dns_address:
      name: "ESP DNS Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: sorting_group_diagnostic

light:
  - platform: binary
    id: co2_led_1
    name: "CO2 light 1"
    output: gpio_led_w1
    icon: mdi:led-outline
    web_server:
      sorting_group_id: sorting_group_controls
  - platform: binary
    id: co2_led_2
    name: "CO2 light 2"
    output: gpio_led_w2
    icon: mdi:led-outline
    web_server:
      sorting_group_id: sorting_group_controls

