  #     id: "pressure_bme680"
  #     state_class: 'measurement'
  #     device_class: "pressure"
  #     accuracy_decimals: 2
  #     filters:
  #     - skip_initial: 3
  #     web_server:
  #       sorting_group_id: sorting_group_temp_hum
  #   humidity:
  #     name: "Humidity"
  #     id: "humidity_bme680"
  #     state_class: 'measurement'
  #     device_class: "humidity"
  #     accuracy_decimals: 2
  #     filters:
  #     - skip_initial: 3
  #     web_server:
  #       sorting_group_id: sorting_group_temp_hum
  #   gas_resistance:
  #     name: "Gas Resistance"
  #     id: "gas_resistance_bme680"
  #     web_server:
  #       sorting_group_id: sorting_group_bme

  # - platform: template
  #   name: "Indoor Air Quality"
  #   id: iaq
  #   icon: "mdi:gauge"
  #   web_server:
  #     sorting_group_id: sorting_group_aqi
  #   # calculation: comp_gas = log(R_gas[ohm]) + 0.04 log(Ohm)/%rh * hum[%rh]
  #   lambda: |-
  #     return log(id(gas_resistance_bme680).state) + 0.04 *  id(humidity_bme680).state;
  #   state_class: "measurement"


  - platform: uptime
    name: "${friendly_name} Uptime"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    icon: mdi:wifi
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic

