  #     name: "Temperature"
  #     id: "temperature_bme680"
  #     oversampling: 16x
  #     state_class: 'measurement'
  #     device_class: "temperature"
  #     accuracy_decimals: 2
  #     filters:
  #     - skip_initial: 3
  #     web_server:
  #       sorting_group_id: sorting_group_temp_hum
  #   pressure:
