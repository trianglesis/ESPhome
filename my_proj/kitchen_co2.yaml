substitutions:
  name: "kitchen-co2"
  friendly_name: "kitchen-co2"

esphome:
  name: "kitchen-co2"
  friendly_name: "kitchen-co2"
  # https://github.com/esphome/esphome/pull/1651
  platformio_options:
    build_flags: "-DI2C_NUM_1=I2C_NUM_0"

esp32:
  board: esp32-c6-devkitm-1
  flash_size: 4MB
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y
      # https://community.home-assistant.io/t/esp32-c6-zigbee2mqtt/713289/4
      # CONFIG_ZB_ENABLED: y
      # CONFIG_ZB_ZED: y
      # CONFIG_ZB_RADIO_NATIVE: y
      # ZB_ED_ROLE: y
    version: "5.3.1"
    platform_version: 6.9.0

# https://github.com/esphome/issues/issues/6639#issuecomment-2669790604
external_components:
  - source: github://pr#8283
    components: [ i2c ]

logger:
  level: WARN
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG
  logs:
    sensor: WARN
    component: WARN
    esp-idf: ERROR
    template.sensor: WARN
    text_sensor: WARN

api:
  encryption:
    key: !secret api_key
  actions:
    - action: calibrate_co2_value
      variables:
        co2_ppm: int
      then:
      - scd4x.perform_forced_calibration:
          value: !lambda 'return co2_ppm;'
          id: scd41_esp32c6

ota:
  - platform: esphome
    password: !secret ota_old_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Board will host Wifi by itself
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
    manual_ip:
        static_ip: !secret ap_static_ip_portable
        gateway: !secret ap_static_gateway
        subnet: 255.255.255.0
        dns1: !secret ap_static_dns
        dns2: 8.8.8.8
  reboot_timeout: 900s
  fast_connect: true

time:
  - platform: homeassistant
    id: esptime

# https://esphome.io/components/web_server.html#sensor-value-graph
web_server:
  version: 3
  sorting_groups:
  - id: sorting_group_co2
    name: "CO2 Values (SDC41)"
    sorting_weight: -1
  - id: sorting_group_aqi
    name: "Air Quality Index"
    sorting_weight: 1
  - id: sorting_group_temp_hum
    name: "Temp, humid, pressure (BME680)"
    sorting_weight: 10
  - id: sorting_group_bme
    name: "Other (BME680)"
    sorting_weight: 20
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 40
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 50

output:
  - platform: gpio
    id: gpio_led_w1
    pin:
      number: 0
  - platform: gpio
    id: gpio_led_w2
    pin:
      number: 1

i2c:
  sda: 22
  scl: 23
  scan: False # Assigned directly
  id: bus_a

sensor:
  # https://esphome.io/components/sensor/scd4x.html#configuration-variables
  # https://esphome.io/components/sensor/index.html#sensor-filters
  - platform: scd4x
    i2c_id: bus_a
    address: 0x62
    update_interval: 10s
    id: scd41_esp32c6
    automatic_self_calibration: true
    measurement_mode: periodic
    co2:
      name: "CO2"
      id: "ppm_co2"
      state_class: 'measurement'
      device_class: "carbon_dioxide"
      unit_of_measurement: "ppm"
      icon: mdi:molecule-co2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
      on_value_range:
      - above: 1201
        then:
          - light.turn_off: co2_led_1
          - light.turn_on: co2_led_2
          - logger.log: 
              format: "Level CO2 is HIGH!"
              level: WARN
              tag: sensor.co2
      - below: 1200
        then:
          - light.turn_off: co2_led_2
          - light.turn_on: co2_led_1
          - logger.log: 
              format: "Level CO2 is NORM!"
              level: WARN
              tag: sensor.co2
    temperature:
      name: "Temperature scd4x"
      id: "temperature_scd4x"
      state_class: 'measurement'
      device_class: "temperature"
      accuracy_decimals: 2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    humidity:
      name: "Humidity scd4x"
      id: "humidity_scd4x"
      state_class: 'measurement'
      device_class: "humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
  # BME 680
