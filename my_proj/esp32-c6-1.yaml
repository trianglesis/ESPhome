substitutions:
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"

esphome:
  # ESP32-C6-WROOM-1-N8
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"

# https://esphome.io/components/esp32.html#id2
# https://github.com/espressif/esp-idf/releases
# https://github.com/platformio/platform-espressif32
# https://docs.platformio.org/en/latest/boards/espressif32/esp32-c6-devkitc-1.html#board-espressif32-esp32-c6-devkitc-1
esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y

    # Experiments:
    # version: dev
    # platform_version: dev

    # version: "5.4.0"  # https://github.com/espressif/esp-idf/releases/tag/v5.4
    # platform_version: 6.10.0  # https://github.com/platformio/platform-espressif32/releases/tag/v6.10.0
    # platform_version: 6.9.0
    # platform_version: 6.8.1

    # for LED: https://gist.github.com/baldowl/a413c2a08c10bc62c1a72328caac98c1
    # version: 5.1.2 # latest version when tested with ESPHome 2023.11.06
    # platform_version: 6.4.0 # latest version when tested with ESPHome 2023.11.06

    # https://github.com/esphome/issues/issues/5864#issuecomment-2380417718
    # version: "5.3.0"
    # platform_version: 6.8.1

    # https://github.com/esphome/issues/issues/5864#issuecomment-2460380038
    # version: 5.2.1

    # Works
    # https://www.reddit.com/r/esp32/comments/1fh8nup/comment/lqm1hvh/
    version: "5.3.1"
    platform_version: 6.9.0

logger:
  level: DEBUG
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG

ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 900s
  fast_connect: true
api:
  encryption:
    key: !secret api_key

captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 10
  - id: sorting_group_monitor
    name: "Sensor monitor"
    sorting_weight: 10
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60
  - id: sorting_group_service
    name: "Service"
    sorting_weight: 90

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
      address_0:
        name: "${friendly_name} IP Address 0"
        web_server:
          sorting_group_id: sorting_group_diagnostic
      address_1:
        name: "${friendly_name} IP Address 1"
        web_server:
          sorting_group_id: sorting_group_diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    bssid:
      name: "${friendly_name} Connected BSSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    mac_address:
      name: "${friendly_name} Mac Wifi Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    scan_results:
      name: "${friendly_name} Latest Scan Results"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    dns_address:
      name: "${friendly_name} DNS Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    web_server:
          sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${friendly_name} WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${friendly_name}  WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true


uart:
  rx_pin: 22
  tx_pin: 21
  baud_rate: 9600

i2c:
  id: bus_a
  setup_priority: -100 # fix for interfering with wifi!
  sda: 6
  scl: 7
  scan: false # workaround as true blocks - it wwould not even do a recovery on i2c

output:
  # https://esphome.io/guides/configuration-types#config-pin-schema
  - platform: gpio
    pin: 
        number: GPIO02
        allow_other_uses: true
    id: output2

  - platform: gpio
    pin: 
        number: GPIO09
        allow_other_uses: true
    id: output9
    
  - platform: gpio
    pin: 
        number: GPIO18
        allow_other_uses: true
    id: output18

  # Onboard LED
  - platform: gpio
    pin: 
        number: GPIO08
        allow_other_uses: true
        inverted: true
        mode:
          input: true
          pullup: true
    id: output8

# https://esphome.io/components/light/spi_led_strip
# spi:
#   mosi_pin: GPIO08
#   clk_pin: GPIO07

# Button
button:
- platform: restart
  name: "Restart"
  web_server:
    sorting_group_id: sorting_group_service

- platform: template
  id: blink_led
  name: "Toggle LED pin 9"
  on_press:
    then:
      - logger.log: Button Pressed
      - switch.toggle: pin_GPIO09
  web_server:
    sorting_group_id: sorting_group_controls

- platform: output
  name: "Button LED pin 18"
  output: output18
  duration: 500ms
  web_server:
    sorting_group_id: sorting_group_controls

light:
  - platform: binary
    name: "${friendly_name} LED (GPIO08) - platform light"
    output: output8

  # # https://esphome.io/components/light/esp32_rmt_led_strip
  # # https://forum.mylocalbytes.com/d/162-localdeck-this-feature-is-not-available-for-the-idf-framework-version-5 
  # # https://www.reddit.com/r/esp32/comments/1fh8nup/comment/meeu3em/?utm_source=share&utm_medium=web3x&utm_name=web3xcss&utm_term=1&utm_content=share_button
  - platform: esp32_rmt_led_strip
    name: "${friendly_name} RTM LED Light"
    id: onboard_led
    rgb_order: GRB
    pin:
      number: GPIO08
      allow_other_uses: true
    num_leds: 1
    chipset: WS2812 # actually WS2812B
    is_rgbw: true
    icon: "mdi:led-outline"
    effects:
      - random:
      - flicker:
      - addressable_rainbow:
    web_server:
      sorting_group_id: sorting_group_controls


switch:
  - platform: gpio
    id: pin_GPIO02
    name: "${friendly_name} PIN (GPIO02)"
    pin:
      number: GPIO02
      mode: output
      allow_other_uses: true
      inverted: false
    on_turn_on:
    - logger.log: "Switch (GPIO02) Turned On!"
    on_turn_off:
    - logger.log: "Switch (GPIO02) Turned Off!"

  - platform: gpio
    id: pin_GPIO09
    name: "${friendly_name} PIN (GPIO09)"
    pin:
      number: GPIO09
      mode: output
      allow_other_uses: true
      inverted: false
    on_turn_on:
    - logger.log: "Switch (GPIO09) Turned On!"
    on_turn_off:
    - logger.log: "Switch (GPIO09) Turned Off!"

  - platform: gpio
    id: pin_GPIO18
    name: "${friendly_name} PIN (GPIO18)"
    pin:
      number: GPIO18
      mode: output
      allow_other_uses: true
      inverted: false
    on_turn_on:
    - logger.log: "Switch (GPIO18) Turned On!"
    on_turn_off:
    - logger.log: "Switch (GPIO18) Turned Off!"
  
  - platform: gpio
    name: "${friendly_name} LED (GPIO08)"
    id: led_switch
    pin:
      number: GPIO08
      allow_other_uses: true
      inverted: yes
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
    - logger.log: "LED (GPIO08) Turned On!"
    on_turn_off:
    - logger.log: "LED (GPIO08) Turned Off!"

binary_sensor:
  - platform: gpio
    name: "Pin GPIO02"
    pin:
      number: GPIO02
      allow_other_uses: true
    web_server:
      sorting_group_id: sorting_group_monitor

  - platform: gpio
    name: "Pin GPIO09"
    pin:
      number: GPIO09
      allow_other_uses: true
    web_server:
      sorting_group_id: sorting_group_monitor

  - platform: gpio
    name: "Pin GPIO18"
    pin:
      number: GPIO18
      allow_other_uses: true
    web_server:
      sorting_group_id: sorting_group_monitor
      
  - platform: gpio
    name: "LED (GPIO08)"
    pin:
      number: GPIO08
      allow_other_uses: true
    web_server:
      sorting_group_id: sorting_group_monitor