substitutions:
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"

esphome:
  name: "esp32-c6-1"
  friendly_name: "ESP32_C6_1"

# https://esphome.io/components/esp32.html#id2
# https://github.com/espressif/esp-idf/releases
esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  variant: esp32c6
  framework:
    type: esp-idf
    
    # Experiments:
    version: "5.4.0"
    platform_version: 6.10.0

    # Works
    # version: "5.3.1"
    # platform_version: 6.9.0


logger:
  level: DEBUG
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 900s
  fast_connect: true

captive_portal:

web_server:
  port: 80
  version: 3
  sorting_groups:
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 10
  - id: sorting_group_monitor
    name: "Sensor monitor"
    sorting_weight: 10
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60
  - id: sorting_group_service
    name: "Service"
    sorting_weight: 90

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
      address_0:
        name: "${friendly_name} IP Address 0"
        web_server:
          sorting_group_id: sorting_group_diagnostic
      address_1:
        name: "${friendly_name} IP Address 1"
        web_server:
          sorting_group_id: sorting_group_diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    bssid:
      name: "${friendly_name} Connected BSSID"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    mac_address:
      name: "${friendly_name} Mac Wifi Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    scan_results:
      name: "${friendly_name} Latest Scan Results"
      web_server:
          sorting_group_id: sorting_group_diagnostic
    dns_address:
      name: "${friendly_name} DNS Address"
      web_server:
          sorting_group_id: sorting_group_diagnostic

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
    web_server:
          sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "${friendly_name} WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "${friendly_name}  WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic

output:
  - platform: gpio
    pin: GPIO18
    id: output18
# https://esphome.io/components/light/spi_led_strip
# spi:
#   mosi_pin: GPIO08
#   clk_pin: GPIO07

# Button
button:
- platform: restart
  name: "Restart"
  web_server:
    sorting_group_id: sorting_group_service
- platform: template
  id: blink_led
  name: "Toggle LED pin 9"
  on_press:
    then:
      - logger.log: Button Pressed
      - switch.toggle: redLED
  web_server:
    sorting_group_id: sorting_group_controls
- platform: output
  name: "Button LED pin 18"
  output: output18
  duration: 500ms
  web_server:
    sorting_group_id: sorting_group_controls

light:
    # # https://esphome.io/components/light/esp32_rmt_led_strip
  - platform: esp32_rmt_led_strip
    rgb_order: RGB
    pin: GPIO08
    num_leds: 1
    rmt_channel: 0
    chipset: WS2812
    name: "${friendly_name} RTM LED Light"
    web_server:
      sorting_group_id: sorting_group_controls
  
  # # https://esphome.io/components/light/beken_spi_led_strip.html#configuration-variables
  # #   Component light.beken_spi_led_strip requires component libretiny.
  - platform: beken_spi_led_strip
    rgb_order: GRB
    pin: GPIO08
    num_leds: 1
    name: "${friendly_name} Beken LED Light"

  # # https://esphome.io/components/light/spi_led_strip
  # - platform: spi_led_strip
  #   num_leds: 1
  #   id: rgb_led
  #   name: "${friendly_name} SPI LED Light"
  #   data_rate: 1MHz


switch:
  - platform: gpio
    pin:
      number: GPIO9
      mode: output
    id: redLED
    on_turn_on:
    - logger.log: "Switch Turned On!"
    on_turn_off:
    - logger.log: "Switch Turned Off!"

binary_sensor:
  - platform: gpio
    name: "Pin GPIO2"
    pin: GPIO2
    web_server:
      sorting_group_id: sorting_group_monitor