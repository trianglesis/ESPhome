# - platform: output
#   id: button_GPIO08_time
#   name: "Button (GPIO08) 500ms"
#   output: output_GPIO08
#   duration: 500ms
#   on_press:
#     then:
#       - logger.log: Button Pressed GPIO08 with time
#   web_server:
#     sorting_group_id: sorting_group_controls

- platform: template
  id: button_GPIO09
  name: "Button (GPIO09)"
  on_press:
    then:
      - logger.log: Button Pressed GPIO09
      - switch.toggle: pin_GPIO09
  web_server:
    sorting_group_id: sorting_group_controls

- platform: output
  id: button_GPIO18
  name: "Button (GPIO18) 500ms"
  output: output_GPIO18
  duration: 500ms
  on_press:
    then:
      - logger.log: Button Pressed GPIO18
  web_server:
    sorting_group_id: sorting_group_controls

light:
  - platform: binary
    name: "LED (GPIO08) platform light"
    output: output_GPIO08

