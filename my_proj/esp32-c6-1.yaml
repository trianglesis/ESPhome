switch:
  - platform: gpio
    id: pin_GPIO09
    name: "(GPIO09)"
    pin:
      number: GPIO09
      mode: output
      allow_other_uses: true
      inverted: false
    on_turn_on:
    - logger.log: "Switch (GPIO09) Turned On!"
    on_turn_off:
    - logger.log: "Switch (GPIO09) Turned Off!"

  - platform: gpio
    id: pin_GPIO18
    name: "(GPIO18)"
    pin:
      number: GPIO18
      mode: output
      allow_other_uses: true
      inverted: false
    on_turn_on:
    - logger.log: "Switch (GPIO18) Turned On!"
    on_turn_off:
    - logger.log: "Switch (GPIO18) Turned Off!"
  
  - platform: gpio
    name: "(GPIO08) LED"
    id: pin_GPIO08
    pin:
      number: GPIO08
      allow_other_uses: true
      inverted: yes
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
    - logger.log: "LED (GPIO08) Turned On!"
    on_turn_off:
    - logger.log: "LED (GPIO08) Turned Off!"

binary_sensor:
  - platform: gpio
    name: "(GPIO08) LED"
    pin:
      number: GPIO08
      allow_other_uses: true
    web_server:
      sorting_group_id: sorting_group_monitor

  - platform: gpio
    name: "(GPIO09)"
    pin:
      number: GPIO09
      allow_other_uses: true
    web_server:
      sorting_group_id: sorting_group_monitor

  - platform: gpio
    name: "(GPIO18)"
    pin:
      number: GPIO18
      allow_other_uses: true
    web_server:
      sorting_group_id: sorting_group_monitor
      
