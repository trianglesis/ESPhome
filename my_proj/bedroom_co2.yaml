substitutions:
  name: "bedroom-co2"
  friendly_name: "bedroom-co2"

esphome:
  name: "bedroom-co2"
  friendly_name: "bedroom-co2"
  platformio_options:
    platform: https://github.com/platformio/platform-espressif32.git#v6.7.0

esp32:
 board: esp32-c6-devkitm-1
 variant: esp32c6
 framework:
   type: esp-idf
   version: 5.2.1
   platform_version: 6.7.0
   sdkconfig_options:
     CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  actions:
    - action: calibrate_co2_value
      variables:
        co2_ppm: int
      then:
      - scd4x.perform_forced_calibration:
          value: !lambda 'return co2_ppm;'
          id: scd41_esp32c6

ota:
  - platform: esphome
    password: !secret ota_old_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Board will host Wifi by itself
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
    manual_ip:
        static_ip: !secret ap_static_ip_portable
        gateway: !secret ap_static_gateway
        subnet: 255.255.255.0
        dns1: !secret ap_static_dns
        dns2: 8.8.8.8
  reboot_timeout: 900s
  fast_connect: true

time:
  - platform: homeassistant
    id: esptime

# https://esphome.io/components/web_server.html#sensor-value-graph
web_server:
  version: 3
  sorting_groups:
  - id: sorting_group_co2
    name: "CO2 Values (SDC41)"
    sorting_weight: -1
  - id: sorting_group_temp_hum
    name: "Temp and humid (AM2302)"
    sorting_weight: 10
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 40
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 50

output:
  - platform: gpio
    id: gpio_led_w1
    pin:
      number: 0
      inverted: true
  - platform: gpio
    id: gpio_led_w2
    pin:
      number: 1
      inverted: true

i2c:
  sda: 4
  scl: 5
  scan: False # Assigned directly
  id: bus_a

sensor:
  # https://esphome.io/components/sensor/scd4x.html#configuration-variables
  # https://esphome.io/components/sensor/index.html#sensor-filters
  - platform: scd4x
    i2c_id: bus_a
    address: 0x62
    id: scd41_esp32c6
    automatic_self_calibration: true
    measurement_mode: periodic
    co2:
      name: "CO2"
      id: "ppm_co2"
      state_class: 'measurement'
      device_class: "carbon_dioxide"
      unit_of_measurement: "ppm"
      icon: mdi:molecule-co2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
      on_value_range:
      - above: 1201
        then:
          - light.turn_off: co2_led_1
          - light.turn_on: co2_led_2
          - logger.log: 
              format: "Level CO2 is HIGH!"
              level: WARN
              tag: sensor.co2
      - below: 1200
        then:
          - light.turn_off: co2_led_2
          - light.turn_on: co2_led_1
          - logger.log: 
              format: "Level CO2 is NORM!"
              level: WARN
              tag: sensor.co2
    temperature:
      name: "Temperature"
      id: "temperature"
      state_class: 'measurement'
      device_class: "temperature"
      accuracy_decimals: 2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    humidity:
      name: "Humidity"
      id: "humidity"
      state_class: 'measurement'
      device_class: "humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    update_interval: 5s


  - platform: uptime
    name: "${friendly_name} Uptime"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    icon: mdi:wifi
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic          
    ssid:
      name: "ESP Connected SSID"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    bssid:
      name: "ESP Connected BSSID"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    mac_address:
      name: "ESP Mac Wifi Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    dns_address:
      name: "ESP DNS Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: sorting_group_diagnostic

light:
  - platform: binary
    id: co2_led_1
    name: "CO2 light 1"
    output: gpio_led_w1
    icon: mdi:led-outline
    web_server:
      sorting_group_id: sorting_group_controls
  - platform: binary
    id: co2_led_2
    name: "CO2 light 2"
    output: gpio_led_w2
    icon: mdi:led-outline
    web_server:
      sorting_group_id: sorting_group_controls

# END