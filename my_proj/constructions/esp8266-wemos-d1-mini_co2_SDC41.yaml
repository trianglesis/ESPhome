# Based: https://github.com/AlexBelfegor/esphome-mq135
substitutions:
  name: "ESP8266-WEMOS-D1-Mini"
  friendly_name: "ESP8266-WEMOS-D1-Mini"

esphome:
  name: esp8266-wemos-d1-mini
  friendly_name: ESP8266-WEMOS-D1-Mini

esp8266:
  board: nodemcuv2

logger:
  level: INFO
  logs:
    component: ERROR
    scd4x.sensor: ERROR
api:
  encryption:
    key: !secret api_key
  actions:
    - action: calibrate_co2_value
      variables:
        co2_ppm: int
      then:
      - scd4x.perform_forced_calibration:
          value: !lambda 'return co2_ppm;'
          id: scd41_wemos

ota:
  - platform: esphome
    password: !secret ota_old_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
  reboot_timeout: 900s
  fast_connect: true

captive_portal:

time:
  - platform: homeassistant
    id: esptime

# https://esphome.io/components/web_server.html#sensor-value-graph
web_server:
  version: 3
  sorting_groups:
  - id: sorting_group_co2
    name: "CO2 Values (SDC41)"
    sorting_weight: -1
  - id: sorting_group_mq_sensor
    name: "MQ Sensor (MQ-135)"
    sorting_weight: 10
  - id: sorting_group_calibration
    name: "Calibration Values"
    sorting_weight: 40
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 50

i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

# Calibrate MQ135 volt and resistance
globals:

#The load resistance on the board. Value in KiloOhms
# Factory rezistor 1k, custom rezistor ~20k soldered manually.
  - id: RLOAD
    type: float
    restore_value: no
    initial_value: '19.65'

# Used for CO2 level, now calibrate it with just a clean, non polluted, no dust air.
  - id: RZERO
    type: float
    restore_value: no
    initial_value: '44.666'

#Atmospheric CO2 level for calibration purposes. Outdoor CO2 level during calibration. Usually 450, but it's better to clarify.
# https://www.co2.earth/daily-co2
  - id: ATMOCO2
    type: float
    restore_value: no
    initial_value: '427'

# MQ-135 actual voltage from board
  - id: volt_resolution
    type: float
    restore_value: no
    initial_value: '5.14'

#Parameters to model temperature and humidity dependence
  - id: CORA
    type: float
    restore_value: no
    initial_value: '0.00035'
  - id: CORB
    type: float
    restore_value: no
    initial_value: '0.02718'
  - id: CORC
    type: float
    restore_value: no
    initial_value: '1.39538'
  - id: CORD
    type: float
    restore_value: no
    initial_value: '0.0018'
  - id: CORE
    type: float
    restore_value: no
    initial_value: '-0.003333333'
  - id: CORF
    type: float
    restore_value: no
    initial_value: '-0.001923077'
  - id: CORG
    type: float
    restore_value: no
    initial_value: '1.130128205'

sensor:
  # https://esphome.io/components/sensor/scd4x.html#configuration-variables
  # https://esphome.io/components/sensor/index.html#sensor-filters
  - platform: scd4x
    i2c_id: bus_a
    address: 0x62
    id: scd41_wemos
    automatic_self_calibration: true
    measurement_mode: periodic
    co2:
      name: "CO2"
      id: "ppm_co2"
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    temperature:
      name: "Temperature"
      id: "temperature"
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    humidity:
      name: "Humidity"
      id: "humidity"
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    update_interval: 1s

  # Store values for some time
  # 15 min
  - platform: template
    name: "CO2 ppm 15min average"
    id: co2_ppm_15m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 1
          send_first_at: 1
  # 1 hour
  - platform: template
    name: "CO2 ppm 1h average"
    id: co2_ppm_1h
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 60
          send_every: 1
          send_first_at: 1
  # 24 hours
  - platform: template
    name: "CO2 ppm 24h average"
    id: co2_ppm_24h
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 1440
          send_every: 1
          send_first_at: 1

  # MQ-135 as AQI, just voltage
  - platform: adc
    pin: A0
    name: "Gas ADC"
    update_interval: 2s
    filters:
      - multiply: 3.3 # for NodeMcu ESP8266 v3 Lua
    accuracy_decimals: 4
    unit_of_measurement: V
    id: sensor_volt
    web_server:
      sorting_group_id: sorting_group_mq_sensor

  - platform: template
    #Linearization of the temperature dependency curve under and above 20 degree C
    #below 20degC: fact = a * t * t - b * t - (h - 33) * d
    #above 20degC: fact = a * t + b * h + c
    #this assumes a linear dependency on humidity
    #getCorrectionFactor
    name: "Correction Factor"
    lambda: |-
      if (id(temperature).state<20) {
        return (id(CORA) * id(temperature).state * id(temperature).state - id(CORB) *
          id(temperature).state + id(CORC) - (id(humidity).state - 33.) * id(CORD));
      } else {
        return (id(CORE) * id(temperature).state + id(CORF) * id(humidity).state + id(CORG));
      }
    update_interval: 15s
    accuracy_decimals: 6
    id: correction_factor
    web_server:
      sorting_group_id: sorting_group_mq_sensor

  - platform: template
    #Get the resistance of the sensor, ie. the measurement value @return The sensor resistance in kOhm
    # RS = [(VC x RL) / VRL] - RL
    # RS_air = ((5.14*1.0)/sensor_volt)-1.0 Calculate RS in fresh air 
    #getResistance
    name: "Resistance"
    lambda: |-
      return ((id(volt_resolution)*id(RLOAD)/id(sensor_volt).state) - id(RLOAD));
    update_interval: 15s
    accuracy_decimals: 3
    unit_of_measurement: kOm
    id: resistance
    web_server:
      sorting_group_id: sorting_group_mq_sensor
    
  - platform: template
    # Get the resistance of the sensor, ie. the measurement value correctedfor temp/hum @return The corrected sensor resistance kOhm
    #getCorrectedResistance
    name: "Corrected Resistance"
    lambda: |-
      return (id(resistance).state / id(correction_factor).state);
    update_interval: 15s
    accuracy_decimals: 3
    unit_of_measurement: kOm
    id: corrected_resistance
    web_server:
      sorting_group_id: sorting_group_mq_sensor

  - platform: uptime
    name: "${friendly_name} Uptime"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      web_server:
        sorting_group_id: sorting_group_diagnostic      
      address_0:
        name: "ESP IP Address 0"
        web_server:
          sorting_group_id: sorting_group_diagnostic      
      address_1:
        name: "ESP IP Address 1"
        web_server:
          sorting_group_id: sorting_group_diagnostic      
    ssid:
      name: "ESP Connected SSID"
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    bssid:
      name: "ESP Connected BSSID"
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    mac_address:
      name: "ESP Mac Wifi Address"
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    dns_address:
      name: "ESP DNS Address"
      web_server:
        sorting_group_id: sorting_group_diagnostic      

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  # Calibration actions:
  - platform: template
    name: "Calibrate by Atmo CO2 level"
    on_press:
      then:
      - scd4x.perform_forced_calibration:
          value: 427  # https://www.co2.earth/daily-co2
          id: scd41_wemos
    web_server:
      sorting_group_id: sorting_group_calibration

