# Based: https://github.com/AlexBelfegor/esphome-mq135
substitutions:
  name: "ESP8266-WEMOS-D1-Mini"
  friendly_name: "ESP8266-WEMOS-D1-Mini"

esphome:
  name: esp8266-wemos-d1-mini
  friendly_name: ESP8266-WEMOS-D1-Mini

esp8266:
  board: nodemcuv2

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key
  actions:
    - action: calibrate_co2_value
      variables:
        co2_ppm: int
      then:
      - scd4x.perform_forced_calibration:
          value: !lambda 'return co2_ppm;'
          id: scd41_wemos

ota:
  - platform: esphome
    password: !secret ota_old_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Board will host Wifi by itself
  ap:
    ssid: "${friendly_name}"
    password: !secret fall_back_wifi_password
    manual_ip:
        static_ip: !secret ap_static_ip_portable
        gateway: !secret ap_static_gateway
        subnet: 255.255.255.0
        dns1: !secret ap_static_dns
        dns2: 8.8.8.8
  reboot_timeout: 900s
  fast_connect: true

time:
  - platform: homeassistant
    id: esptime

# https://esphome.io/components/web_server.html#sensor-value-graph
web_server:
  version: 3
  sorting_groups:
  - id: sorting_group_co2
    name: "CO2 Values (SDC41)"
    sorting_weight: -1
  - id: sorting_group_temp_hum
    name: "Temp and humid (AM2302)"
    sorting_weight: 10
  - id: sorting_group_controls
    name: "Controls"
    sorting_weight: 40
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 50

output:
  - platform: gpio
    id: gpio_led_w1
    pin:
      number: D4
      inverted: true
  - platform: gpio
    pin: D8
    id: gpio_led

i2c:
  sda: 4
  scl: 5
  scan: False # Assigned directly
  id: bus_a

binary_sensor:
  - platform: gpio
    pin: D3
    name: "Motion Sensor"
    id: "wemos_motion"
    icon: mdi:motion-sensor
    web_server:
      sorting_group_id: sorting_group_temp_hum

sensor:
  # https://esphome.io/components/sensor/scd4x.html#configuration-variables
  # https://esphome.io/components/sensor/index.html#sensor-filters
  - platform: scd4x
    i2c_id: bus_a
    address: 0x62
    id: scd41_wemos
    automatic_self_calibration: true
    measurement_mode: periodic
    co2:
      name: "CO2"
      id: "ppm_co2"
      state_class: 'measurement'
      device_class: "carbon_dioxide"
      unit_of_measurement: "ppm"
      icon: mdi:molecule-co2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
      on_value_range:
      - above: 1101
        then:
          - light.turn_on: co2_led
          - logger.log: 
              format: "Level CO2 is HIGH!"
              level: WARN
              tag: sensor.co2
      - below: 1100
        then:
          - light.turn_off: co2_led
          - logger.log: 
              format: "Level CO2 is NORM!"
              level: WARN
              tag: sensor.co2
    temperature:
      name: "Temperature"
      id: "temperature"
      state_class: 'measurement'
      device_class: "temperature"
      accuracy_decimals: 2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    humidity:
      name: "Humidity"
      id: "humidity"
      state_class: 'measurement'
      device_class: "humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 2
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_co2
    update_interval: 5s

  - platform: dht
    pin: D7
    model: AM2302
    temperature:
      name: "Temperature AM2302"
      id: dht_temperature
      state_class: 'measurement'
      device_class: "temperature"
      accuracy_decimals: 2
      icon: mdi:thermometer
      filters:
      - skip_initial: 3
      web_server:
        sorting_group_id: sorting_group_temp_hum
    humidity:
      name: "Humidity AM2302"
      id: dht_humidity
      state_class: 'measurement'
      unit_of_measurement: "%"
      device_class: "humidity"
      accuracy_decimals: 2
      icon: mdi:water-percent
      filters:
      - lambda: if ((id(dht_temperature).state)>=0) {return (id(dht_humidity).raw_state + (25.0 - id(dht_temperature).state) * (-0.15));} else {return id(dht_humidity).raw_state;}
      web_server:
        sorting_group_id: sorting_group_temp_hum
    update_interval: 5s
  # Store values for some time
  # 15 min
  - platform: template
    name: "CO2 ppm 15min average"
    id: co2_ppm_15m
    icon: mdi:molecule-co2
    unit_of_measurement: "ppm"
    lambda: |-
      return id(ppm_co2).state;
    web_server:
      sorting_group_id: sorting_group_co2
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 30
          send_every: 1
          send_first_at: 1
  # 1 hour
  - platform: template
    name: "CO2 ppm 1h average"
    id: co2_ppm_1h
    icon: mdi:molecule-co2
    unit_of_measurement: "ppm"
    lambda: |-
      return id(ppm_co2).state;
    web_server:
      sorting_group_id: sorting_group_co2
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 60
          send_every: 1
          send_first_at: 1
  # 24 hours
  - platform: template
    name: "CO2 ppm 24h average"
    id: co2_ppm_24h
    icon: mdi:molecule-co2
    unit_of_measurement: "ppm"
    lambda: |-
      return id(ppm_co2).state;
    web_server:
      sorting_group_id: sorting_group_co2
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 1440
          send_every: 1
          send_first_at: 1

  - platform: uptime
    name: "${friendly_name} Uptime"
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: wifi_signal # Reports the WiFi signal strength/RSSI in dB
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    icon: mdi:wifi
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: copy # Reports the WiFi signal strength in %
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    device_class: ""
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP IP Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic          
    ssid:
      name: "ESP Connected SSID"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    bssid:
      name: "ESP Connected BSSID"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    mac_address:
      name: "ESP Mac Wifi Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      
    dns_address:
      name: "ESP DNS Address"
      icon: mdi:wifi
      web_server:
        sorting_group_id: sorting_group_diagnostic      

button:
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: sorting_group_diagnostic

light:
  - platform: binary
    id: w1_led
    name: "Wemos W1 LED"
    output: gpio_led_w1
    icon: mdi:led-outline
    web_server:
      sorting_group_id: sorting_group_controls
  - platform: binary
    id: co2_led
    name: "CO2_light"
    output: gpio_led
    icon: mdi:led-outline
    web_server:
      sorting_group_id: sorting_group_controls

# END