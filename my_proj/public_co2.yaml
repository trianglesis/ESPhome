substitutions:
  name: "co2"
  friendly_name: "Датчик CO2 co2.local"

esphome:
  name: "co2"
  friendly_name: "Датчик CO2 co2.local"
  # https://github.com/esphome/esphome/pull/1651
  platformio_options:
    build_flags: "-DI2C_NUM_1=I2C_NUM_0"
  on_boot:
    then:
      - text_sensor.template.publish:
          id: ok_lvl
          state: "до 1000 ppm"
      - text_sensor.template.publish:
          id: worse_lvl
          state: "до 1200 ppm"
      - text_sensor.template.publish:
          id: bad_lvl
          state: "до 1500 ppm"
      - text_sensor.template.publish:
          id: danger_lvl
          state: "більше 1900 ppm"
      - text_sensor.template.publish:
          id: help_url_1
          state: "https://aerostar.ua/ua/news/novosti/co2-u-primischennjahl-na-scho-vplivae-dioksid-vuglecju-u-povitri-ta-jak-zmenshiti-jogo-riven.html"
      - text_sensor.template.publish:
          id: help_url_2
          state: "https://health.gov.ua/activity/scientific-educational-activity/co2-influence-on-health/"
      - text_sensor.template.publish:
          id: help_url_3
          state: "https://aam.com.ua/2024/05/09/vysokyj-riven-co2-maye-tryvozhnyj-vplyv-na-virusy-shho-shyryatsya-povitryam/"
      - text_sensor.template.publish:
          id: help_url_4
          state: "https://uk.wikipedia.org/wiki/Якість_повітря_в_приміщенні#Вуглекислий_газ"

# https://esphome.io/components/esp32
esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y
      # https://community.home-assistant.io/t/esp32-c6-zigbee2mqtt/713289/4
      # CONFIG_ZB_ENABLED: y
      # CONFIG_ZB_ZED: y
      # CONFIG_ZB_RADIO_NATIVE: y
      # ZB_ED_ROLE: y
    version: "5.3.1"
    platform_version: 6.9.0

# https://github.com/esphome/issues/issues/6639#issuecomment-2669790604
external_components:
  - source: github://pr#8283
    components: [ i2c ]

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG
  logs:
    sensor: WARN
    component: WARN
    esp-idf: ERROR
    template.sensor: WARN
    text_sensor: WARN

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 4h
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  # No power save on portable device
  power_save_mode: none
  # When no WifI
  reboot_timeout: 4h
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_portable
      password: !secret wifi_password_portable
  # Board will host Wifi by itself
  ap:
    ssid: "Датчик CO2 - co2.local"
    ap_timeout: 60s
    manual_ip:
      static_ip: 192.168.4.4
      gateway: 192.168.4.4
      subnet: 255.255.255.0
      dns1: 192.168.4.4
      dns2: 8.8.8.8
  # Do not fast connect when portable
  # fast_connect: true

web_server:
  port: 80
  version: 3
  local: true
  ota: false
  log: false
  sorting_groups:
  - id: sorting_group_co2
    name: "Показники в повітрі"
    sorting_weight: -1
  - id: sorting_group_statistics
    name: "Статистика"
    sorting_weight: 10
  - id: sorting_group_help
    name: "Інформація"
    sorting_weight: 20
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60
  - id: sorting_group_service
    name: "Service"
    sorting_weight: 90

# https://github.com/esphome/issues/issues/6639
i2c:
  sda: GPIO06
  scl: GPIO07
  scan: false
  id: bus_a

sensor:
  # https://esphome.io/components/sensor/scd4x.html#configuration-variables
  # https://esphome.io/components/sensor/index.html#sensor-filters
  - platform: scd4x
    i2c_id: bus_a
    address: 0x62
    id: scd41_esp32
    automatic_self_calibration: true
    measurement_mode: periodic
    co2:
      name: "CO2"
      id: "ppm_co2"
      state_class: 'measurement'
      device_class: "carbon_dioxide"
      unit_of_measurement: "ppm"
      icon: mdi:molecule-co2
      filters:
      - skip_initial: 1
      web_server:
        sorting_group_id: sorting_group_co2
      on_value:
        then:
          - lambda: |-
              float co2 = std::min(float(2200), x);
              auto t = (co2-440)/(2200 - 440);
              auto interpolated = ESPHSVColor(uint8_t((1-t)*96), 255, 32);
              auto inter_rgb = interpolated.to_rgb();

              auto call = id(co2light).turn_on();
              call.set_rgb(inter_rgb.red / 255.0, inter_rgb.green / 255.0, inter_rgb.blue / 255.0);
              call.set_brightness(1);
              call.perform();
    temperature:
      name: "Температура"
      id: "temperature"
      state_class: 'measurement'
      device_class: "temperature"
      accuracy_decimals: 2
      filters:
      - skip_initial: 1
      web_server:
        sorting_group_id: sorting_group_co2
    humidity:
      name: "Вологість"
      id: "humidity"
      state_class: 'measurement'
      device_class: "humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 2
      filters:
      - skip_initial: 1
      web_server:
        sorting_group_id: sorting_group_co2
    update_interval: 5s
    # Other info
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  - platform: uptime
    name: Uptime txt
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

  - platform: template
    name: "OK"
    id: ok_lvl
    icon: mdi:check-circle-outline
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 2
  - platform: template
    name: "Погіршений рівень"
    id: worse_lvl
    icon: mdi:alert
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 3
  - platform: template
    name: "Поганий рівень"
    id: bad_lvl
    icon: mdi:account-alert
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 4
  - platform: template
    name: "Небезпечний рівень"
    id: danger_lvl
    icon: mdi:close-octagon
    web_server:
      sorting_group_id: sorting_group_help
      sorting_weight: 5
  - platform: template
    name: "Справка"
    id: help_url_1
    icon: mdi:help-box-outline
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 6
  - platform: template
    name: "Інформація"
    id: help_url_2
    icon: mdi:help-box-outline
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 7
  - platform: template
    name: "CO2 та COVID"
    id: help_url_3
    icon: mdi:help-box-outline
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 8
  - platform: template
    name: "Wiki"
    id: help_url_4
    icon: mdi:help-box-outline
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 9

