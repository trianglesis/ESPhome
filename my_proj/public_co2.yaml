substitutions:
  name: "co2"
  friendly_name: "Датчик CO2 co2.local"

esphome:
  name: "co2"
  friendly_name: "Датчик CO2 co2.local"
  # https://github.com/esphome/esphome/pull/1651
  platformio_options:
    build_flags: "-DI2C_NUM_1=I2C_NUM_0"
  on_boot:
    then:
      - logger.log: 
          format: "Getting all states from globals!"
          level: INFO
          tag: sensor.co2
      - sensor.template.publish:
          id: co2_ppm_1m
          state: !lambda 'return id(co2_1min);'
      - sensor.template.publish:
          id: co2_ppm_2m
          state: !lambda 'return id(co2_2min);'
      - sensor.template.publish:
          id: co2_ppm_3m
          state: !lambda 'return id(co2_3min);'
      - sensor.template.publish:
          id: co2_ppm_4m
          state: !lambda 'return id(co2_4min);'
      - sensor.template.publish:
          id: co2_ppm_5m
          state: !lambda 'return id(co2_5min);'
      - sensor.template.publish:
          id: co2_ppm_15m
          state: !lambda 'return id(co2_15min);'
      - sensor.template.publish:
          id: co2_ppm_30m
          state: !lambda 'return id(co2_30min);'
      - sensor.template.publish:
          id: co2_ppm_1h
          state: !lambda 'return id(co2_1h);'
      - sensor.template.publish:
          id: co2_ppm_24h
          state: !lambda 'return id(co2_24h);'
      # Help info
      - text_sensor.template.publish:
          id: normal_lvl
          state: " < 1000 ppm"
      - text_sensor.template.publish:
          id: worse_lvl
          state: " > 1200 ppm"
      - text_sensor.template.publish:
          id: bad_lvl
          state: " > 1500 ppm"
      - text_sensor.template.publish:
          id: danger_lvl
          state: " > 1900 ppm"
      - text_sensor.template.publish:
          id: help_url
          state: "https://aerostar.ua/ua/news/novosti/co2-u-primischennjahl-na-scho-vplivae-dioksid-vuglecju-u-povitri-ta-jak-zmenshiti-jogo-riven.html"
  
  on_shutdown:
    then:
      - logger.log: 
          format: "Setting all states in globals!"
          level: INFO
          tag: sensor.co2
      - globals.set:
          id: co2_1min
          value: !lambda 'return id(co2_ppm_1m).state;'
      - globals.set:
          id: co2_2min
          value: !lambda 'return id(co2_ppm_2m).state;'
      - globals.set:
          id: co2_3min
          value: !lambda 'return id(co2_ppm_3m).state;'
      - globals.set:
          id: co2_4min
          value: !lambda 'return id(co2_ppm_4m).state;'
      - globals.set:
          id: co2_5min
          value: !lambda 'return id(co2_ppm_5m).state;'
      - globals.set:
          id: co2_15min
          value: !lambda 'return id(co2_ppm_15m).state;'
      - globals.set:
          id: co2_30min
          value: !lambda 'return id(co2_ppm_30m).state;'
      - globals.set:
          id: co2_1h
          value: !lambda 'return id(co2_ppm_1h).state;'
      - globals.set:
          id: co2_24h
          value: !lambda 'return id(co2_ppm_24h).state;'

# https://esphome.io/components/esp32
esp32:
  board: esp32-c6-devkitc-1
  flash_size: 8MB
  variant: esp32c6
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: y
      # https://community.home-assistant.io/t/esp32-c6-zigbee2mqtt/713289/4
      # CONFIG_ZB_ENABLED: y
      # CONFIG_ZB_ZED: y
      # CONFIG_ZB_RADIO_NATIVE: y
      # ZB_ED_ROLE: y
    version: "5.3.1"
    platform_version: 6.9.0

# https://github.com/esphome/issues/issues/6639#issuecomment-2669790604
external_components:
  - source: github://pr#8283
    components: [ i2c ]

logger:
  level: INFO
  baud_rate: 115200
  hardware_uart: USB_SERIAL_JTAG
  logs:
    sensor: WARN
    component: WARN
    esp-idf: ERROR
    template.sensor: WARN
    text_sensor: WARN

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 4h
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  # No power save on portable device
  power_save_mode: none
  # When no WifI
  reboot_timeout: 4h
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
    - ssid: !secret wifi_ssid_portable
      password: !secret wifi_password_portable
  # Board will host Wifi by itself
  ap:
    ssid: "Датчик CO2 - co2.local"
    ap_timeout: 60s
    manual_ip:
      static_ip: 192.168.4.4
      gateway: 192.168.4.4
      subnet: 255.255.255.0
      dns1: 8.8.8.8
  # Do not fast connect when portable
  # fast_connect: true
  on_disconnect:
    then:
    - logger.log: 
        format: "Setting all states in globals on WiFi disconnect!"
        level: INFO
        tag: sensor.co2
    - globals.set:
        id: co2_1min
        value: !lambda 'return id(co2_ppm_1m).state;'
    - globals.set:
        id: co2_2min
        value: !lambda 'return id(co2_ppm_2m).state;'
    - globals.set:
        id: co2_3min
        value: !lambda 'return id(co2_ppm_3m).state;'
    - globals.set:
        id: co2_4min
        value: !lambda 'return id(co2_ppm_4m).state;'
    - globals.set:
        id: co2_5min
        value: !lambda 'return id(co2_ppm_5m).state;'
    - globals.set:
        id: co2_15min
        value: !lambda 'return id(co2_ppm_15m).state;'
    - globals.set:
        id: co2_30min
        value: !lambda 'return id(co2_ppm_30m).state;'
    - globals.set:
        id: co2_1h
        value: !lambda 'return id(co2_ppm_1h).state;'
    - globals.set:
        id: co2_24h
        value: !lambda 'return id(co2_ppm_24h).state;'

# Save CO2 history levels between reboots
globals:
  - id: co2_1min
    type: int
    restore_value: true
  - id: co2_2min
    type: int
    restore_value: true
  - id: co2_3min
    type: int
    restore_value: true
  - id: co2_4min
    type: int
    restore_value: true
  - id: co2_5min
    type: int
    restore_value: true
  - id: co2_15min
    type: int
    restore_value: true
  - id: co2_30min
    type: int
    restore_value: true
  - id: co2_1h
    type: int
    restore_value: true
  - id: co2_24h
    type: int
    restore_value: true

web_server:
  port: 80
  version: 3
  local: true
  ota: false
  log: false
  sorting_groups:
  - id: sorting_group_co2
    name: "Показники в повітрі"
    sorting_weight: -1
  - id: sorting_group_statistics
    name: "Статистика"
    sorting_weight: 10
  - id: sorting_group_help
    name: "Інформація"
    sorting_weight: 20
  - id: sorting_group_diagnostic
    name: "Diagnostic info"
    sorting_weight: 60
  - id: sorting_group_service
    name: "Service"
    sorting_weight: 90

# https://github.com/esphome/issues/issues/6639
i2c:
  sda: GPIO06
  scl: GPIO07
  scan: false
  id: bus_a

sensor:
  # https://esphome.io/components/sensor/scd4x.html#configuration-variables
  # https://esphome.io/components/sensor/index.html#sensor-filters
  - platform: scd4x
    i2c_id: bus_a
    address: 0x62
    id: scd41_esp32
    automatic_self_calibration: true
    measurement_mode: periodic
    co2:
      name: "CO2"
      id: "ppm_co2"
      state_class: 'measurement'
      device_class: "carbon_dioxide"
      unit_of_measurement: "ppm"
      icon: mdi:molecule-co2
      filters:
      - skip_initial: 1
      web_server:
        sorting_group_id: sorting_group_co2
      on_value:
        then:
          - lambda: |-
              float co2 = std::min(float(2000), x);
              auto t = (co2-440)/(2000 - 440);
              auto interpolated = ESPHSVColor(uint8_t((1-t)*96), 255, 32);
              auto inter_rgb = interpolated.to_rgb();

              auto call = id(co2light).turn_on();
              call.set_rgb(inter_rgb.red / 255.0, inter_rgb.green / 255.0, inter_rgb.blue / 255.0);
              call.set_brightness(1);
              call.perform();
    temperature:
      name: "Температура:"
      id: "temperature"
      state_class: 'measurement'
      device_class: "temperature"
      accuracy_decimals: 2
      filters:
      - skip_initial: 1
      web_server:
        sorting_group_id: sorting_group_co2
    humidity:
      name: "Вологість:"
      id: "humidity"
      state_class: 'measurement'
      device_class: "humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 2
      filters:
      - skip_initial: 1
      web_server:
        sorting_group_id: sorting_group_co2
    update_interval: 5s
  # Store values for some time
  # 1 min
  - platform: template
    name: "1 min"
    id: co2_ppm_1m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 1
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 1
  # 2 min
  - platform: template
    name: "2 min"
    id: co2_ppm_2m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 2
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 2
  # 3 min
  - platform: template
    name: "3 min"
    id: co2_ppm_3m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 3
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 3
  # 4 min
  - platform: template
    name: "4 min"
    id: co2_ppm_4m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 4
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 4
  # 5 min
  - platform: template
    name: "5 min"
    id: co2_ppm_5m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 5
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 5
  # 15 min
  - platform: template
    name: "15 min"
    id: co2_ppm_15m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 15
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 6
  # 30 min
  - platform: template
    name: "30 min"
    id: co2_ppm_30m
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 30
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 7
  # 1 hour
  - platform: template
    name: "1 година"
    id: co2_ppm_1h
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 60
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 8
  # 24 hours
  - platform: template
    name: "24 години"
    id: co2_ppm_24h
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    lambda: |-
      return id(ppm_co2).state;
    update_interval: 60s
    filters:
      - max:
          window_size: 1440
          send_every: 1
          send_first_at: 1
    web_server:
      sorting_group_id: sorting_group_statistics
      sorting_weight: 9

  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    web_server:
      sorting_group_id: sorting_group_diagnostic

text_sensor:
  - platform: template
    name: "Нормальний рівень"
    id: normal_lvl
    icon: mdi:molecule-co2
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 1
  - platform: template
    name: "Погіршений рівень"
    id: worse_lvl
    icon: mdi:alert
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 2
  - platform: template
    name: "Поганий - провітрювання необхідно!"
    id: bad_lvl
    icon: mdi:account-alert
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 3
  - platform: template
    name: "Небезпечний - провітрити невідкладно!"
    id: danger_lvl
    icon: mdi:close-octagon
    web_server:
      sorting_group_id: sorting_group_help
      sorting_weight: 4
  - platform: template
    name: "Інформація"
    id: help_url
    icon: mdi:help-box-outline
    web_server:
      sorting_group_id: sorting_group_help  
      sorting_weight: 5

