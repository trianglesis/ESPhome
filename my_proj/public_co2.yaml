            id: co2_2min
            value: !lambda 'return id(co2_ppm_2m).state;'
        - globals.set:
            id: co2_3min
            value: !lambda 'return id(co2_ppm_3m).state;'
        - globals.set:
            id: co2_4min
            value: !lambda 'return id(co2_ppm_4m).state;'
        - globals.set:
            id: co2_5min
            value: !lambda 'return id(co2_ppm_5m).state;'
        - globals.set:
            id: co2_15min
            value: !lambda 'return id(co2_ppm_15m).state;'
        - globals.set:
            id: co2_30min
            value: !lambda 'return id(co2_ppm_30m).state;'
        - globals.set:
            id: co2_1h
            value: !lambda 'return id(co2_ppm_1h).state;'
        - globals.set:
            id: co2_24h
            value: !lambda 'return id(co2_ppm_24h).state;'
        - logger.log: 
            format: "Saved all states in globals!"
            level: INFO
            tag: sensor.co2
    web_server:
      sorting_group_id: sorting_group_service
  
